<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#FFFFFF" />
  <g
    transform="translate(48 48) scale(13)"
    fill="none"
    stroke="#0D9464"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- Front rim & body of the pan -->
    <path stroke-width="1.8" d="M 4.0 19.7 A 8.4 2.35 0 0 0 20.8 19.7" />
    <path
      stroke-width="1.8"
      d="M 4.0 19.7 C 4.0 23.4 6.0 25.9 8.9 26.2 H 15.9 C 18.8 25.9 20.8 23.4 20.8 19.7"
    />
    <!-- Back rim interrupted cleanly behind the tilted heart -->
    <path stroke-width="1.65" d="M 4.0 19.7 C 4.8 18.4 6.9 17.7 9.9 17.5" />
    <path stroke-width="1.65" d="M 20.8 19.7 C 20.2 18.6 19.0 18.0 17.8 17.8" />
    <!-- Pan handle -->
    <path stroke-width="2.0" d="M 20.7 19.7 L 28.2 17.0" />
    <!-- Plump heart tilted gently to the right, emerging from the pan -->
    <g transform="rotate(14 12.2 19.9)">
      <path
        stroke-width="1.9"
        d="M 12.3 20.0 C 12.3 20.0 5.4 15.8 5.4 11.1 A 3.65 3.65 0 0 1 12.3 8.9 A 3.65 3.65 0 0 1 19.2 11.1 C 19.2 15.8 12.3 20.0 12.3 20.0 Z"
      />
    </g>
  </g>
</svg>
